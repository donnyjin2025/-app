name: 每日更新行情与宏观数据

on:
  schedule:
    # UTC 21:30 = 北京时间 5:30（美股收盘后）；UTC 09:30 = 北京时间 17:30（A股/国内期货收盘后）
    - cron: '30 21 * * *'
    - cron: '30 9 * * *'
  workflow_dispatch: {}
  push:
    paths: [catalog.json, fetch_data.py]

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 抓取数据（仅用 Python 标准库）
        run: python3 fetch_data.py

      - name: 提交数据变更
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "数据无变化，跳过提交"
          else
            git commit -m "自动更新数据 $(date -u +%F)"
            git push
          fi
